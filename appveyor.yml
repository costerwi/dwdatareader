# appveyor.yml - https://www.appveyor.com/docs/lang/python
---
image:
  - Visual Studio 2022
  - Ubuntu

build: false

environment:
  # Prevent uv from building heavy packages (like pandas) from source if wheels are missing
  UV_NO_BUILD: "1"

install:
  # - py --list
  - python -m pip install uv
  - uv tool install tox --with tox-uv

test_script:
  - uv tool run tox -v
